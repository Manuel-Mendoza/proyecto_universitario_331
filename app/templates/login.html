{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión | Mundo Agropecuario CAM</title>
    <link
      rel="stylesheet"
      href="{% static 'staradmin/vendors/css/vendor.bundle.base.css' %}"
    />
    <link rel="stylesheet" href="{% static 'staradmin/css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/branding.css' %}" />
    <link
      rel="shortcut icon"
      href="{% static 'branding/logo CAM.jpg.jpeg' %}"
    />
  </head>
  <body>
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <main class="content-wrapper d-flex align-items-center auth px-0">
          <div class="row w-100 mx-0">
            <div class="col-lg-4 mx-auto">
              <div class="auth-form-light text-left py-5 px-4 px-sm-5">
                <div class="brand-logo">
                  <img src="{% static 'branding/logo CAM.jpg.jpeg' %}" alt="Inversiones Mundo Agropecuario CAM" />
                </div>
                <h1 class="h4">¡Hola! Comencemos</h1>
                <p class="fw-light">Inicia sesión para continuar.</p>
                <form class="pt-3" method="post" onsubmit="return false;" aria-describedby="login-notice">
                  <div class="form-group">
                    <label for="username">Usuario</label>
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="username"
                      placeholder="Usuario"
                      autocomplete="username"
                    />
                  </div>
                  <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                      type="password"
                      class="form-control form-control-lg"
                      id="password"
                      placeholder="Contraseña"
                      autocomplete="current-password"
                    />
                  </div>
                  <div class="mt-3 d-grid gap-2">
                    <button type="button" class="btn btn-primary btn-lg fw-medium auth-form-btn" disabled>
                      INICIAR SESIÓN
                    </button>
                  </div>
                  <p id="login-notice" class="text-muted small mt-3">
                    Pantalla de demostración. El inicio de sesión aún no está disponible.
                  </p>
                  <div class="text-center mt-4 fw-light">
                    <a href="{% url 'home' %}" class="text-primary">Volver al dashboard</a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
