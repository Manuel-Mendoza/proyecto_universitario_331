{% extends 'layouts/auth.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
  <h1 class="h4">Iniciar sesión</h1>
  <form class="pt-3" method="post" onsubmit="return false;">
    <div class="form-group">
      <label for="username">Usuario</label>
      <input
        type="text"
        class="form-control form-control-lg"
        id="username"
        placeholder="Usuario"
        autocomplete="username"
      />
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        class="form-control form-control-lg"
        id="password"
        placeholder="Contraseña"
        autocomplete="current-password"
      />
    </div>
    <div class="mt-3 d-grid gap-2">
      <button type="button" class="btn btn-primary btn-lg fw-medium auth-form-btn" disabled>
        INICIAR SESIÓN
      </button>
    </div>
    <div class="text-center mt-4 fw-light">
      <a href="{% url 'home' %}" class="text-primary">Volver al dashboard</a>
    </div>
  </form>
{% endblock %}
